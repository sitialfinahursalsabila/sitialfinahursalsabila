name: generate animation

on:
  # Runs every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # Allows manual triggers
  workflow_dispatch:
  
  # Runs on every push to the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1. Generates the snake patterns from the contribution graph
     # 1. Generates the snake patterns from the contribution graph
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#8B4513&color_dots=#ebedf0,#D2B48C,#A67B5B,#8B4513,#5C4033
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D2B48C&color_dots=#161b22,#5C4033,#8B4513,#A67B5B,#D2B48C
            
      # 2. Push the content of <build_dir> to a branch
      # The animation will be available at https://raw.githubusercontent.com/<user>/<repo>/output/github-contribution-grid-snake.svg
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
