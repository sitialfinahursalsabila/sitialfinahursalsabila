name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
       outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3E2723&color_dots=#FFF8E7,#EAD8B1,#D2B48C,#B89C7C,#9E8462
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#EAD8B1&color_dots=#161b22,#5C4033,#8B4513,#A67B5B,#D2B48C
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
